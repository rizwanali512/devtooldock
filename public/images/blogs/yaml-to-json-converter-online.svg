    <g transform="translate(150 175)">
      <rect x="0" y="0" width="520" height="44" rx="14" fill="rgba(255,255,255,0.10)"/>
      <rect x="18" y="14" width="260" height="16" rx="8" fill="rgba(255,255,255,0.22)"/>
