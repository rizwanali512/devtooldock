      <text x="130" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="26" font-weight="800" fill="rgba(255,255,255,0.92)">YAML</text>
      <path d="M130 152 L130 170" stroke="rgba(255,255,255,0.75)" stroke-width="8" stroke-linecap="round"/>
