      <rect x="22" y="92" width="300" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
      <rect x="22" y="122" width="410" height="12" rx="6" fill="rgba(255,255,255,0.14)"/>
      <rect x="22" y="152" width="360" height="12" rx="6" fill="rgba(255,255,255,0.12)"/>
      <rect x="22" y="182" width="430" height="12" rx="6" fill="rgba(255,255,255,0.10)"/>
    </g>

    <g transform="translate(760 190)">
      <circle cx="110" cy="125" r="105" fill="url(#accent2)" opacity="0.95"/>
      <path d="M74 118 C74 84 92 64 110 64 C128 64 146 84 146 118 C146 152 128 172 110 172 C92 172 74 152 74 118 Z" fill="rgba(11,18,32,0.55)"/>
      <circle cx="92" cy="118" r="10" fill="rgba(255,255,255,0.9)"/>
      <circle cx="128" cy="118" r="10" fill="rgba(255,255,255,0.9)"/>
      <path d="M92 150 Q110 162 128 150" stroke="rgba(255,255,255,0.75)" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M110 40 L110 20" stroke="rgba(255,255,255,0.55)" stroke-width="6" stroke-linecap="round"/>
      <path d="M160 66 L176 52" stroke="rgba(255,255,255,0.45)" stroke-width="6" stroke-linecap="round"/>
      <path d="M60 66 L44 52" stroke="rgba(255,255,255,0.45)" stroke-width="6" stroke-linecap="round"/>
