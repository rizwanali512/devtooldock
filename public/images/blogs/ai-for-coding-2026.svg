  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" fill="#E5E7EB">
    <text x="150" y="390" font-size="56" font-weight="800">AI for Coding</text>
    <text x="150" y="445" font-size="32" font-weight="600" opacity="0.9">Best tools and workflows for developers</text>
